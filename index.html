
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>PratikCep</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#155eef;color:white;padding:22px 16px}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;font-size:14px}
main{max-width:850px;margin:auto;padding:16px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:10px;margin:6px 0 12px;background:white;color:#172033}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 15px;background:#155eef;color:white;font-weight:bold;cursor:pointer}
button:active{opacity:.75}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.top input{margin:0}
.secondary{background:#e8efff;color:#155eef}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 14px}
.chips button{white-space:nowrap;background:#e5eaf3;color:#26344d}
.chips button.active{background:#155eef;color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tool{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:15px;min-height:105px;cursor:pointer}
.tool strong{display:block;margin:7px 0}
.tool small{color:#667085}
.star{float:right;background:none;color:#d49b00;padding:2px;font-size:20px}
.panel{background:white;padding:18px;border-radius:15px;margin-top:15px;border:1px solid #e2e8f0}
.panel h2{margin:0 0 15px;font-size:20px}
.result{background:#edf4ff;color:#1749a0;padding:13px;border-radius:10px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.hidden{display:none!important}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
footer{text-align:center;color:#667085;font-size:12px;padding:25px}
.dark{background:#111827;color:#f3f4f6}
.dark .tool,.dark .panel{background:#1f2937;border-color:#374151}
.dark input,.dark select,.dark textarea{background:#111827;color:white;border-color:#4b5563}
.dark .tool small{color:#cbd5e1}
.dark .result{background:#263b5b;color:#e4edff}
.dark .chips button{background:#374151;color:white}
.dark .chips button.active{background:#155eef}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>📱 PratikCep</h1>
<p>Günlük işler için pratik araçlar</p>
</header>
<main>
<div class="top">
<input id="search" placeholder="Araç ara...">
<button id="themeBtn" class="secondary">🌙</button>
</div>
<div class="chips" id="chips"></div>
<div id="tools" class="grid"></div>
<section id="panel" class="panel hidden">
<div class="row" style="align-items:center">
<h2 id="panelTitle" style="flex:1"></h2>
<button id="closeBtn" class="secondary">Kapat ✕</button>
</div>
<div id="panelBody"></div>
</section>
</main>
<footer>PratikCep · Pratik araçlar cebinde</footer>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const tools=[
{id:"discount",name:"İndirim hesapla",desc:"İndirimli fiyatı bul",icon:"🏷️",cat:"Hesaplama"},
{id:"percent",name:"Yüzde hesapla",desc:"Bir sayının yüzdesi",icon:"％",cat:"Hesaplama"},
{id:"age",name:"Yaş hesapla",desc:"Yaşını öğren",icon:"🎂",cat:"Hesaplama"},
{id:"date",name:"Tarih farkı",desc:"İki tarih arasındaki süre",icon:"📅",cat:"Hesaplama"},
{id:"calculator",name:"Hesap makinesi",desc:"Dört işlem ve yüzde",icon:"🧮",cat:"Hesaplama"},
{id:"currency",name:"Döviz çevirici",desc:"Döviz kuru ile hesapla",icon:"💱",cat:"Finans"},
{id:"notes",name:"Notlarım",desc:"Notlarını kaydet",icon:"📝",cat:"Günlük"},
{id:"petition",name:"Dilekçe hazırla",desc:"Dilekçe metni oluştur",icon:"📄",cat:"Belge"},
{id:"qr",name:"QR kod oluştur",desc:"Metni QR koda dönüştür",icon:"▦",cat:"Günlük"},
{id:"password",name:"Şifre oluştur",desc:"Güçlü şifre üret",icon:"🔐",cat:"Güvenlik"},
{id:"barcode",name:"Barkod okuyucu",desc:"Kamerayla barkod tara",icon:"📷",cat:"Günlük"}
];
let category="Tümü",current="";
let favorites=JSON.parse(localStorage.getItem("pc-favorites")||"[]");
let recent=JSON.parse(localStorage.getItem("pc-recent")||"[]");
function save(){localStorage.setItem("pc-favorites",JSON.stringify(favorites));localStorage.setItem("pc-recent",JSON.stringify(recent))}
function renderChips(){
const cats=["Tümü","Hesaplama","Finans","Günlük","Belge","Güvenlik","⭐ Favoriler"];
$("chips").innerHTML=cats.map(c=>`<button data-cat="${c}" class="${category===c?"active":""}">${c}</button>`).join("");
}
function renderTools(){
const q=$("search").value.toLowerCase();
let list=tools.filter(t=>(category==="Tümü"||t.cat===category||(category==="⭐ Favoriler"&&favorites.includes(t.id)))&&(t.name+" "+t.desc).toLowerCase().includes(q));
$("tools").innerHTML=list.map(t=>`<div class="tool" data-open="${t.id}">
<button class="star" data-star="${t.id}" aria-label="Favori">${favorites.includes(t.id)?"★":"☆"}</button>
<div style="font-size:25px">${t.icon}</div><strong>${t.name}</strong><small>${t.desc}</small>
</div>`).join("")||"<p>Sonuç bulunamadı.</p>";
}
function openTool(id){
current=id;
const t=tools.find(x=>x.id===id);if(!t)return;
recent=[id,...recent.filter(x=>x!==id)].slice(0,8);save();
$("panelTitle").textContent=t.icon+" "+t.name;
$("panelBody").innerHTML=toolHTML(id);
$("panel").classList.remove("hidden");
$("panel").scrollIntoView({behavior:"smooth",block:"start"});
if(id==="notes")$("notesText").value=localStorage.getItem("pratikcep-notes")||"";
if(id==="currency")loadRates();
}
function toolHTML(id){
switch(id){
case"discount":return `<label>Ürün fiyatı (TL)</label><input id="price" type="number" placeholder="Örn. 1000"><label>İndirim oranı (%)</label><input id="rate" type="number" placeholder="Örn. 20"><button data-action="discount">Hesapla</button><div id="result" class="result hidden"></div>`;
case"percent":return `<label>Sayı</label><input id="number" type="number" placeholder="Örn. 200"><label>Yüzde (%)</label><input id="percentRate" type="number" placeholder="Örn. 15"><button data-action="percent">Hesapla</button><div id="result" class="result hidden"></div>`;
case"age":return `<label>Doğum tarihin</label><input id="birth" type="date"><button data-action="age">Yaşımı hesapla</button><div id="result" class="result hidden"></div>`;
case"date":return `<label>Başlangıç tarihi</label><input id="date1" type="date"><label>Bitiş tarihi</label><input id="date2" type="date"><button data-action="date">Tarih farkını hesapla</button><div id="result" class="result hidden"></div>`;
case"calculator":return `<label>Birinci sayı</label><input id="calcA" type="number" placeholder="Sayı"><label>İşlem</label><select id="calcOp"><option value="+">Toplama (+)</option><option value="-">Çıkarma (-)</option><option value="*">Çarpma (×)</option><option value="/">Bölme (÷)</option><option value="%">Yüzde (%)</option></select><label>İkinci sayı</label><input id="calcB" type="number" placeholder="Sayı"><button data-action="calculator">Hesapla</button><div id="result" class="result hidden"></div>`;
case"currency":return `<label>Miktar</label><input id="currencyAmount" type="number" value="1" min="0"><div class="row"><div><label>Kaynak para</label><select id="currencyFrom"><option>TRY</option><option>USD</option><option>EUR</option><option>GBP</option></select></div><div><label>Hedef para</label><select id="currencyTo"><option>USD</option><option>TRY</option><option>EUR</option><option>GBP</option></select></div></div><button data-action="currency">Çevir</button><div id="result" class="result">Kurlar yükleniyor...</div><small id="rateInfo"></small>`;
case"notes":return `<label>Notların</label><textarea id="notesText" placeholder="Notunu buraya yaz..."></textarea><button data-action="saveNotes">Notu kaydet</button><div id="result" class="result hidden"></div>`;
case"petition":return `<label>Ad Soyad</label><input id="petName" placeholder="Ad Soyad"><label>Kurum</label><input id="petOrg" placeholder="Başvurulacak kurum"><label>Konu</label><input id="petSubject" placeholder="Dilekçe konusu"><label>Açıklama</label><textarea id="petBody" placeholder="Talebini ve açıklamanı yaz..."></textarea><label>Tarih</label><input id="petDate" type="date"><button data-action="petition">Dilekçe oluştur</button><div id="result" class="result hidden"></div><button class="secondary" data-action="copyResult">Metni kopyala</button>`;
case"qr":return `<label>QR kod içeriği</label><textarea id="qrText" placeholder="Metin veya bağlantı"></textarea><button data-action="qr">QR kod oluştur</button><div id="qrOutput" style="margin-top:15px"></div>`;
case"password":return `<label>Şifre uzunluğu</label><input id="passLength" type="number" value="16" min="4" max="64"><button data-action="password">Şifre oluştur</button><div id="result" class="result hidden"></div><button class="secondary" data-action="copyResult">Kopyala</button>`;
case"barcode":return `<p>Kamera izni vererek barkodu okutabilirsin. Tarayıcın desteklemiyorsa bu özellik çalışmayabilir.</p><button data-action="scan">Kamerayı aç</button><video id="video" style="width:100%;margin-top:12px" autoplay playsinline></video><div id="result" class="result hidden"></div><button class="secondary" data-action="stopScan">Kamerayı kapat</button>`;
}
return"";
}
function showResult(msg){const r=$("result");if(r){r.textContent=msg;r.classList.remove("hidden")}}
function num(id){return Number($(id).value)}
function valid(...ids){return ids.every(id=>$(id)&&$(id).value.trim()!=="")}
function calculate(action){
if(action==="discount"){
if(!valid("price","rate"))return showResult("Lütfen tüm alanları doldur.");
let p=num("price"),r=num("rate");showResult("İndirim tutarı: "+(p*r/100).toFixed(2)+" TL\nİndirimli fiyat: "+(p-p*r/100).toFixed(2)+" TL");
}
if(action==="percent"){
if(!valid("number","percentRate"))return showResult("Lütfen tüm alanları doldur.");
showResult("Sonuç: "+(num("number")*num("percentRate")/100));
}
if(action==="age"){
if(!valid("birth"))return showResult("Doğum tarihini seç.");
let b=new Date($("birth").value+"T00:00:00"),n=new Date();if(b>n)return showResult("Doğum tarihi gelecekte olamaz.");
let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}
showResult(`Yaşın: ${y} yıl, ${m} ay, ${d} gün.`);
}
if(action==="date"){
if(!valid("date1","date2"))return showResult("İki tarihi de seç.");
let a=new Date($("date1").value+"T00:00:00"),b=new Date($("date2").value+"T00:00:00");let days=Math.round(Math.abs(b-a)/86400000);
showResult("İki tarih arasında "+days+" gün var.");
}
if(action==="calculator"){
if(!valid("calcA","calcB"))return showResult("İki sayıyı da gir.");
let a=num("calcA"),b=num("calcB"),op=$("calcOp").value,v;
if(op==="+")v=a+b;else if(op==="-")v=a-b;else if(op==="*")v=a*b;else if(op==="/"){if(b===0)return showResult("Sıfıra bölme yapılamaz.");v=a/b}else v=a*b/100;
showResult("Sonuç: "+v);
}
}
let rates=null;
async function loadRates(){
const cached=localStorage.getItem("pc-exchange-cache");
if(cached){try{rates=JSON.parse(cached).rates}catch(e){}}
try{
const res=await fetch("https://open.er-api.com/v6/latest/USD");
if(!res.ok)throw Error("Kur alınamadı");
const data=await res.json();if(data.result!=="success")throw Error("Kur alınamadı");
rates=data.rates;localStorage.setItem("pc-exchange-cache",JSON.stringify({rates:rates,date:data.time_last_update_utc}));
$("rateInfo").textContent="Kur güncellemesi: "+data.time_last_update_utc;
convert();
}catch(e){
if(rates){$("rateInfo").textContent="İnternet bağlantısı yok; kayıtlı kurlar kullanılıyor.";convert()}
else $("result").textContent="Kurlar yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.";
}
}
function convert(){
if(!rates)return;
let amount=num("currencyAmount"),from=$("currencyFrom").value,to=$("currencyTo").value;
if(!Number.isFinite(amount)||amount<0)return showResult("Geçerli bir miktar gir.");
let v=amount/rates[from]*rates[to];
showResult(amount+" "+from+" = "+v.toFixed(2)+" "+to);
}
function action(a){
if(["discount","percent","age","date","calculator"].includes(a))return calculate(a);
if(a==="saveNotes"){localStorage.setItem("pratikcep-notes",$("notesText").value);showResult("Notun kaydedildi.");return}
if(a==="petition"){
if(!valid("petName","petOrg","petSubject","petBody"))return showResult("Lütfen gerekli alanları doldur.");
let text=`${$("petOrg").value.toLocaleUpperCase("tr-TR")} MAKAMINA\n\nKonu: ${$("petSubject").value}\n\n${$("petBody").value}\n\nGereğini arz ederim.\n\n${$("petDate").value}\n${$("petName").value}`;
showResult(text);return}
if(a==="copyResult"){let el=$("result");if(el&&el.textContent)navigator.clipboard?.writeText(el.textContent).then(()=>showResult("Kopyalandı.")).catch(()=>showResult("Kopyalama desteklenmiyor."));return}
if(a==="qr"){
let text=$("qrText").value.trim();if(!text)return alert("Önce metin veya bağlantı gir.");
$("qrOutput").innerHTML="";
if(!window.QRCode){let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=()=>new QRCode($("qrOutput"),{text,width:210,height:210});s.onerror=()=>alert("QR kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.");document.head.appendChild(s)}
else new QRCode($("qrOutput"),{text,width:210,height:210});
return}
if(a==="password"){
let len=Math.max(4,Math.min(64,num("passLength")||16)),chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
let out="";for(let i=0;i<len;i++)out+=chars[Math.floor(Math.random()*chars.length)];showResult(out);return}
if(a==="currency"){convert();return}
if(a==="scan"){startScan();return}
if(a==="stopScan"){stopScan();return}
}
let stream=null,scanTimer=null;
async function startScan(){
if(!("BarcodeDetector"in window)){showResult("Bu Chrome sürümü barkod taramayı desteklemiyor.");return}
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
$("video").srcObject=stream;
const detector=new BarcodeDetector();
const video=$("video");
async function scan(){
if(!stream)return;
if(video.readyState>=2){try{let codes=await detector.detect(video);if(codes.length){showResult("Okunan barkod: "+codes[0].rawValue);stopScan();return}}catch(e){}}
scanTimer=setTimeout(scan,500);
}
scan();
}catch(e){showResult("Kamera açılamadı. Kamera iznini kontrol et.")}
}
function stopScan(){if(scanTimer)clearTimeout(scanTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if($("video"))$("video").srcObject=null}
$("chips").addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(!b)return;category=b.dataset.cat;renderChips();renderTools()});
$("tools").addEventListener("click",e=>{
let star=e.target.closest("[data-star]");if(star){let id=star.dataset.star;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();renderTools();return}
let card=e.target.closest("[data-open]");if(card)openTool(card.dataset.open);
});
$("panelBody").addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(b)action(b.dataset.action)});
$("closeBtn").addEventListener("click",()=>{$("panel").classList.add("hidden");stopScan()});
$("search").addEventListener("input",renderTools);
$("themeBtn").addEventListener("click",()=>{document.body.classList.toggle("dark");localStorage.setItem("pc-theme",document.body.classList.contains("dark")?"dark":"light")});
if(localStorage.getItem("pc-theme")==="dark")document.body.classList.add("dark");
renderChips();renderTools();
})();
</script>
</body>
  </html>
